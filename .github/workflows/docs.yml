name: docs (Deploy to GitHub Pages)

on:
  push:
    branches: [dev]
    paths:
      - 'apps/docs/**'
      # Generated from the release posts; the check below fails when it is out of date.
      - 'apps/frontend/src/components/whatsnew/releases.json'
      - '.github/workflows/docs.yml'
  # PRs only build, so onBrokenLinks: throw fails the PR instead of the deploy.
  pull_request:
    paths:
      - 'apps/docs/**'
      # Generated from the release posts; the check below fails when it is out of date.
      - 'apps/frontend/src/components/whatsnew/releases.json'
      - '.github/workflows/docs.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    name: Build
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/docs
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: apps/docs/.nvmrc
          cache: yarn
          cache-dependency-path: apps/docs/yarn.lock

      - name: Install dependencies
        run: yarn install --frozen-lockfile
      - name: Test the release post scripts
        run: node --test "scripts/**/*.test.mjs"
      # Front matter (zod), em dashes, required blocks, shot ids, releases.json in sync.
      - name: Check release posts
        run: node scripts/check-release-posts.mjs
      - name: Build website
        run: yarn build
      # learn_more links and their anchors, and every <Since> badge against releases.json.
      - name: Check release posts against the build
        run: node scripts/check-release-posts.mjs --build build
